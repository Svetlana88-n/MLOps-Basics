[project]
name = "mlops-basics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Svetlana88-n", email = "kalaturskaya.sveta@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mlops-basics = "mlops_basics:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]